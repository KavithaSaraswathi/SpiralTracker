# Server Configuration
server.port=8080

# MySQL Database Configuration
# Set DB_URL, DB_USERNAME, and DB_PASSWORD in the environment for local credentials.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spiraltrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional sample seed data (Set to true only when you want to seed development data)
spiraltrack.seed.enabled=${SEED_DATA:false}
