# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Database Configuration
# Local development uses the default DB_HOST/DB_PORT/DB_NAME values below.
# Set DB_URL to override the generated JDBC URL when your provider requires a custom URL.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:spiraltrack_db}?sslmode=${DB_SSLMODE:disable}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional sample seed data (Set to true only when you want to seed development data)
spiraltrack.seed.enabled=${SEED_DATA:false}

# Expose a minimal health endpoint for deployment health checks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
