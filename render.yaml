services:
  - type: web
    name: spiraltrack-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: spiraltrack-frontend
          property: host
      - key: SEED_DATA
        value: "false"

  - type: web
    name: spiraltrack-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: spiraltrack-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
